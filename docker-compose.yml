version: '3.9'

services:
  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
    depends_on:
      - db
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: flymenu
      POSTGRES_USER: flymenu
      POSTGRES_PASSWORD: flymenu
    volumes:
      - postgres_data:/var/lib/postgresql/data/

volumes:
  postgres_data:
